<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WaveRise • Editar Perfil</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<div class="app">

<header class="heroPequeno">

<button class="btnVoltar" onclick="history.back()">
←
</button>

<div>

<h1>⚙️ Editar Perfil</h1>

<p>Atualize seus dados</p>

</div>

</header>


<section class="card">

<h2>👤 Informações</h2>

<br>

<label>Nome</label>

<input
type="text"
id="nome"
placeholder="Seu nome"
>

<br><br>

<label>Local</label>

<input
type="text"
id="local"
placeholder="Ex: Santos"
>

<br><br>

<label>Objetivo</label>

<input
type="text"
id="objetivo"
placeholder="Ex: Evoluir no surf"
>

</section>


<section class="card">

<h2>🏄 Surf</h2>

<br>

<label>Prancha favorita</label>

<input
type="text"
id="prancha"
placeholder="Ex: Funboard 7'0"
>

<br><br>

<label>Praia favorita</label>

<input
type="text"
id="praia"
placeholder="Ex: Santos"
>

</section>


<section class="card">

<button
id="salvarPerfil"
class="botaoPrincipal">

💾 Salvar Alterações

</button>

<br><br>

<button
class="btnVoltar"
onclick="history.back()">

Cancelar

</button>

</section>


<nav class="menuBottom">

<a href="../index.html">

<span>🏠</span>

<small>Início</small>

</a>

<a href="mar.html">

<span>🌊</span>

<small>Mar</small>

</a>

<a href="diario.html">

<span>📖</span>

<small>Diário</small>

</a>

<a href="coach.html">

<span>🤖</span>

<small>Coach</small>

</a>

<a class="ativo" href="perfil.html">

<span>👤</span>

<small>Perfil</small>

</a>

</nav>

</div>


<script type="module">

// ======================================================
// CARREGAR PERFIL
// ======================================================

const perfil = JSON.parse(

    localStorage.getItem("perfilWaveRise")

) || {};


// ======================================================
// ELEMENTOS
// ======================================================

const nome = document.getElementById("nome");

const localInput = document.getElementById("local");

const objetivo = document.getElementById("objetivo");

const prancha = document.getElementById("prancha");

const praia = document.getElementById("praia");

const salvar = document.getElementById("salvarPerfil");


// ======================================================
// PREENCHER
// ======================================================

nome.value = perfil.nome || "";

localInput.value = perfil.local || "";

objetivo.value = perfil.objetivo || "";

prancha.value = perfil.prancha || "";

praia.value = perfil.praia || "";


// ======================================================
// SALVAR
// ======================================================

salvar.addEventListener("click", () => {

    const perfilAtual = {

        ...perfil,

        nome: nome.value.trim() || "Surfista",

        local: localInput.value.trim(),

        objetivo: objetivo.value.trim(),

        prancha: prancha.value.trim(),

        praia: praia.value.trim()

    };


    localStorage.setItem(

        "perfilWaveRise",

        JSON.stringify(perfilAtual)

    );


    alert("✅ Perfil atualizado!");


    window.location.href = "perfil.html";

});

</script>

</body>

</html>
