<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Conquistas - WaveRise</title>

<link rel="stylesheet" href="../style.css">

</head>


<body>


<div class="app">


<header class="topo">

<button class="voltar" onclick="history.back()">
← Voltar
</button>

<h1>🏆 Conquistas</h1>

</header>



<section class="card">

<h2 id="nivelAtual">
Nível 1
</h2>


<p id="xpAtual">
XP: 0
</p>


<div class="barra">

<div id="progressoXP"></div>

</div>


</section>




<section class="card">


<h2>🏅 Medalhas</h2>


<div class="conquistas">


<div class="medalha bloqueada" id="primeira">

🌊  
<h3>Primeira Onda</h3>
<p>Registre sua primeira sessão</p>

</div>



<div class="medalha bloqueada" id="dez">

🏄
<h3>10 Sessões</h3>
<p>Complete 10 sessões de surf</p>

</div>



<div class="medalha bloqueada" id="cinquenta">

🔥
<h3>50 Ondas</h3>
<p>Supere 50 ondas</p>

</div>


</div>


</section>



<script type="module" src="conquistas.js"></script>


</div>


</body>

</html>
