<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WaveRise • Diário</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<div class="app">

<header class="heroPequeno">

<button class="btnVoltar" onclick="history.back()">
←
</button>

<div>

<h1>🌊 Diário de Surf</h1>

<p>Registre todas as suas sessões</p>

</div>

</header>

<section class="card">

<h2>Registrar Sessão</h2>

<label>📍 Praia</label>
<input id="praia" class="inputWave" placeholder="Ex: Santos">

<label>📅 Data</label>
<input id="data" class="inputWave" type="date">

<label>⏱ Tempo no mar</label>
<input id="tempo" class="inputWave" placeholder="Ex: 2 horas">

<label>🏄 Prancha utilizada</label>
<select id="pranchaUsada" class="inputWave">
<option value="">Selecione uma prancha</option>
</select>

<label>🌊 Ondas pegadas</label>
<input id="ondas" class="inputWave" type="number">

<label>⭐ Nota da sessão</label>
<input id="nota" class="inputWave" type="number" min="0" max="10">

<label>📝 Observações</label>
<textarea
id="observacoes"
class="inputWave"
rows="5"
placeholder="Como foi sua sessão?">
</textarea>

<button id="salvarSessao" class="botaoPrincipal">
🌊 Salvar Sessão
</button>

</section>

<section class="card">

<h2>📖 Últimas Sessões</h2>

<div id="listaSessoes">

<p>Nenhuma sessão registrada.</p>

</div>

</section>
