<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WaveRise</title>

<link rel="stylesheet" href="../style.css">

<style>

html,body{

margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;

display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(180deg,#07192f,#0d3567);

font-family:Arial,sans-serif;

}

.splash{

text-align:center;
animation:fade 1.2s ease;

}

.logo{

width:190px;

animation:flutuar 2s infinite ease-in-out;

}

h1{

margin-top:25px;

color:white;

font-size:52px;

}

p{

margin-top:10px;

color:#9ddcff;

font-size:22px;

}

@keyframes fade{

from{

opacity:0;
transform:scale(.8);

}

to{

opacity:1;
transform:scale(1);

}

}

@keyframes flutuar{

0%{

transform:translateY(0px);

}

50%{

transform:translateY(-12px);

}

100%{

transform:translateY(0px);

}

}

</style>

</head>

<body>

<div class="splash">
<img src="waverise_logo.png" class="logo">

<h1>WaveRise</h1>

<p>Seu melhor surf, todos os dias.</p>

</div>

<script>

setTimeout(()=>{

window.location.href="../index.html";

},2500);

</script>

</body>
</html>
